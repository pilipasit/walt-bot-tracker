name: walt-bot

# Runs the live Walt bot every ~10 minutes on GitHub's servers.
# Scheduled runs trade only when the repository variable LIVE_ENABLED is "true".
# Manual runs: mode "prices" (no sign-in needed), "dry" (reads the account, places nothing), "live".
on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "prices = check data only; dry = read the account, place nothing; live = real orders"
        type: choice
        options: [prices, dry, live]
        default: dry

concurrency:
  group: walt-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -q -r bot/requirements.txt
      - name: One bot cycle
        working-directory: bot
        env:
          WALT_TOKEN_KEY: ${{ secrets.WALT_TOKEN_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: python -m waltbot cloud-run --mode "$MODE"
      - name: Save state, renewed sign-in and tracker page
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'prices')
        run: |
          git config user.name "walt-bot"
          git config user.email "walt-bot@users.noreply.github.com"
          git add -A bot index.html
          git diff --cached --quiet && exit 0
          git commit -q -m "bot cycle $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
