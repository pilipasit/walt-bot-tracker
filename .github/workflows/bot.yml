name: walt-bot

# Runs the live Walt bot on GitHub's servers, independent of the owner's PC.
#
# GitHub starts scheduled workflows "best effort": on this repo they fired twice in eleven hours. So one run does not
# do one cycle — it LOOPS: a bot cycle every 10 minutes for ~5.5 hours, saving state and the renewed sign-in after
# every cycle, then it starts the next run itself (workflow_dispatch from GITHUB_TOKEN is allowed to do that). The
# hourly schedule is only a backup that restarts the chain if it ever breaks. `concurrency` keeps it to one at a time.
#
# Real orders only when the repository variable LIVE_ENABLED is "true".
#   Stop at the end of the current loop:  set LIVE_ENABLED to false (the chain is not continued).
#   Stop now:                             cancel the running "walt-bot" run in the Actions tab, AND set LIVE_ENABLED false.
# Stops are attached to every order on Walt's side, so open positions stay protected between cycles and while stopped.
#
# Manual runs: mode "prices" (no sign-in), "dry" (reads the account, places nothing), "live"; `minutes` = loop length.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "prices = check data only; dry = read the account, place nothing; live = real orders"
        type: choice
        options: [markets, prices, dry, live]
        default: markets
      minutes:
        description: "how long this run keeps cycling (one cycle every 10 minutes; 0 = a single cycle)"
        default: "330"

concurrency:
  group: walt-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || vars.MARKETS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ github.event_name == 'schedule' && 'markets' || inputs.mode }}
      MINUTES: ${{ github.event_name == 'schedule' && '330' || inputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -q -r bot/requirements.txt
      - name: Bot cycles every 10 minutes
        env:
          WALT_TOKEN_KEY: ${{ secrets.WALT_TOKEN_KEY }}
          EOS_SEND_SECRET: ${{ secrets.EOS_SEND_SECRET }}
          POSITIONS_SYNC_KEY: ${{ secrets.POSITIONS_SYNC_KEY }}
        run: |
          git config user.name "walt-bot"
          git config user.email "walt-bot@users.noreply.github.com"
          # In a rebase, -X theirs keeps THIS run's commit: the bot owns its state files.
          save() {
                        git add -A bot bot.html index.html
            git diff --cached --quiet && return 0
            git commit -q -m "bot cycle $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push -q && return 0; sleep 7; done
            echo "::warning::could not push the state this cycle; will retry next cycle"
          }
          end=$(( $(date +%s) + MINUTES * 60 ))
          n=0
          while :; do
            n=$((n + 1))
            if [ -f bot/STOP ]; then echo "bot/STOP exists — stopping"; break; fi
            echo "::group::cycle $n $(date -u +'%H:%M') UTC ($MODE)"
            M="$MODE"
            # In markets mode: the full analysis on each 10-minute mark (and the first cycle), quick quotes every minute.
            if [ "$MODE" = "markets" ] && [ "$n" -gt 1 ] && [ $(( $(date +%s) / 60 % 10 )) -ne 0 ]; then M=quote; fi
            (cd bot && python -m waltbot cloud-run --mode "$M") || echo "::warning::cycle $n failed"
            echo "::endgroup::"
            save
            now=$(date +%s)
            step=600; [ "$MODE" = "markets" ] && step=60
            [ $(( now + step )) -ge "$end" ] && break
            sleep $(( step - now % step + 3 ))   # wake just after the next step mark
            git pull --rebase -q -X theirs || git rebase --abort || true
          done
      - name: Start the next run (keeps the bot going without the PC)
        if: success() && env.MODE == 'markets' && env.MINUTES != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f bot/STOP ] && { echo "bot/STOP exists — not continuing"; exit 0; }
          gh workflow run bot.yml --repo "${{ github.repository }}" -f mode=markets -f minutes=330
